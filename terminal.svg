@keyframes fi{to{opacity:1}}
.p0{opacity:0;animation:fi .001s .7s forwards}
.l1{opacity:0;animation:fi .001s .9s forwards}
.l2{opacity:0;animation:fi .001s 1.05s forwards}
.l3{opacity:0;animation:fi .001s 1.2s forwards}
.l4{opacity:0;animation:fi .001s 1.35s forwards}
.l5{opacity:0;animation:fi .001s 1.5s forwards}
.l6{opacity:0;animation:fi .001s 1.65s forwards}
.l7{opacity:0;animation:fi .001s 1.82s forwards}
.l8{opacity:0;animation:fi .001s 2.0s forwards}
.l9{opacity:0;animation:fi .001s 2.17s forwards}
.l10{opacity:0;animation:fi .001s 2.35s forwards}
.l11{opacity:0;animation:fi .001s 2.52s forwards}
.l12{opacity:0;animation:fi .001s 2.68s forwards}
.l13{opacity:0;animation:fi .001s 2.83s forwards}
.l14{opacity:0;animation:fi .001s 3.0s forwards}
.l15{opacity:0;animation:fi .001s 3.17s forwards}
.l16{opacity:0;animation:fi .001s 3.33s forwards}
