<circle cx="23" cy="509" r="4" fill="#28c840"/>
<text class="sm" x="33" y="513" fill="#28c840">connected</text>
<text class="sm" x="115" y="513" fill="#6e7681">YAML</text>
<text class="sm" x="156" y="513" fill="#6e7681">UTF-8</text>

<!-- Status right -->
<text class="sm" x="474" y="513" fill="#6e7681">production</text>
<rect x="536" y="500" width="128" height="16" rx="8" fill="#58a6ff" fill-opacity=".12"/>
<text class="sm" x="600" y="513" text-anchor="middle" fill="#58a6ff">DevOps Engineer</text>

